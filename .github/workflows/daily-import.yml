name: Daily Phone Data Import

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      # The importers append every number they write here; the last step
      # revalidates those numbers' cached pages.
      TOUCHED_NUMBERS_FILE: touched_numbers.txt
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests supabase beautifulsoup4 lxml

      - name: Run FTC importer (US data)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ftc_daily.py

      - name: Run ReverseCanada importer (Canadian data)
        # Run even when the FTC step fails (it now fails on a missing weekday
        # file); the job still ends red, but the other sources and the
        # rollups shouldn't be skipped with it.
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/reversecanada_daily.py

      # Rebuild the per-area-code rollup that every number page reads. Must run
      # after the importers, since it summarises what they just inserted, and is
      # the only full aggregation in the daily cycle. Chunked because a single
      # full refresh exceeds PostgREST's 8s statement timeout — see the script.
      - name: Refresh area summaries
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/refresh_area_summaries.py

      # Same idea for the monthly report pages: they read one materialized row
      # per month, so recompute this month and last after the import.
      - name: Refresh monthly reports
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/refresh_monthly_reports.py

      # Number pages are ISR-cached for a week, and nothing above goes through
      # the app, so without this a newly reported number keeps its cached page
      # until the window lapses. Runs even if an earlier step failed, so a
      # partial import still shows up. Warns and skips if the secret is unset.
      - name: Revalidate changed pages
        if: ${{ !cancelled() }}
        env:
          SITE: https://www.canadial.com
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: python scripts/revalidate_pages.py
