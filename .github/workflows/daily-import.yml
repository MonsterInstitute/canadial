name: Daily Phone Data Import

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

# Everything writes through the site's admin API (src/app/api/admin/*), so the
# only credentials here are ADMIN_TOKEN and REVALIDATE_SECRET. No database
# credentials.
jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SITE: https://www.canadial.com
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      # The importers append every number they wrote here; the last step
      # purges those numbers' cached pages.
      TOUCHED_NUMBERS_FILE: touched_numbers.txt
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      # Raw FTC files go to R2 first, then into the per-number aggregates.
      - name: Run FTC importer (US data)
        run: python scripts/ftc_daily.py

      - name: Run ReverseCanada importer (Canadian data)
        # Run even when the FTC step fails; the job still ends red, but the
        # other source and the rollups shouldn't be skipped with it.
        if: ${{ !cancelled() }}
        run: python scripts/reversecanada_daily.py

      # Rebuild per-number counters and the rollups every page reads. Must run
      # after the importers, since it summarises what they just inserted.
      - name: Refresh rollups
        if: ${{ !cancelled() }}
        run: python scripts/refresh_rollups.py

      # Purge the cached pages of numbers the import touched (edge cache) and
      # revalidate their area-code and report pages (ISR). Sends nothing when
      # nothing was written. Warns and skips if the secret is unset.
      - name: Revalidate changed pages
        if: ${{ !cancelled() }}
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: python scripts/revalidate_pages.py
