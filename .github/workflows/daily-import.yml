name: Daily Phone Data Import

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests supabase beautifulsoup4 lxml

      - name: Run FTC importer (US data)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ftc_daily.py

      - name: Run ReverseCanada importer (Canadian data)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/reversecanada_daily.py

      # Rebuild the per-area-code rollup that every number page reads. Must run
      # after the importers, since it summarises what they just inserted, and is
      # the only full aggregation in the daily cycle. Chunked because a single
      # full refresh exceeds PostgREST's 8s statement timeout — see the script.
      - name: Refresh area summaries
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/refresh_area_summaries.py
