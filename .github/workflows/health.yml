name: Health and cost guardrails

# Asserts the invariants in AGENTS.md against the live site every day. A failed
# run emails the repo owner — that is the alerting mechanism.
#
# On Supabase the cost that took the site down was egress; on Cloudflare D1 it
# is rows read. The design rule is the same: a page render reads a bounded
# number of rows that never grows with the data. The render-cost step checks
# that bound directly, from the x-d1-rows-read header the Worker sets on every
# response (worker.ts).

on:
  schedule:
    - cron: '0 9 * * *' # daily, an hour after the import
  workflow_dispatch:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    env:
      SITE: https://www.canadial.com
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      # D1 holds 10 GB per database. Phase 2's FTC aggregates are the growth.
      MAX_DB_MB: '6000'
      # Rows read by one number-page render. Measured 2-7 (lookup: org, number
      # counters, 5 latest reports; area summary by primary key). Anything far
      # above that is a read that scales with the data.
      MAX_ROWS_PER_RENDER: '50'
      # Daily rollups must have run within this window.
      MAX_ROLLUP_AGE_HOURS: '36'
      # Core pages, area codes and the number pages worth indexing. The bound
      # catches a wholesale relisting of every number page, not growth.
      MAX_SITEMAP_URLS: '30000'
    steps:
      - name: Database size and rollup freshness
        run: |
          h=$(curl -fsS -H "Authorization: Bearer $ADMIN_TOKEN" "$SITE/api/admin/health")
          echo "$h"
          python3 - "$h" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          h = json.loads(sys.argv[1])
          mb = (h.get("db_bytes") or 0) / 1e6
          print(f"database: {mb:.0f} MB / {os.environ['MAX_DB_MB']} MB")
          if mb >= float(os.environ["MAX_DB_MB"]):
              print(f"::error::D1 database is {mb:.0f} MB"); sys.exit(1)
          limit = float(os.environ["MAX_ROLLUP_AGE_HOURS"])
          for k in ("site_stats", "area_summaries_oldest", "monthly_reports"):
              t = h.get(k)
              age = (datetime.now(timezone.utc) - datetime.fromisoformat(t.replace("Z", "+00:00"))).total_seconds() / 3600 if t else None
              print(f"{k}: {t} ({age:.1f} h old)" if age is not None else f"{k}: missing")
              if age is None or age > limit:
                  print(f"::error::{k} is stale or missing; the daily refresh is not running"); sys.exit(1)
          PY

      - name: Number pages are bounded and edge-cached
        run: |
          url="$SITE/lookup/4164428848"
          hdr=$(curl -sI "$url" | tr -d '\r')
          rows=$(echo "$hdr" | awk -F': ' 'tolower($1)=="x-d1-rows-read"{print $2}')
          cc=$(echo "$hdr" | awk -F': ' 'tolower($1)=="cache-control"{print $2}')
          echo "rows read per render: $rows (max $MAX_ROWS_PER_RENDER); cache-control: $cc"
          [ -n "$rows" ] || { echo "::error::No x-d1-rows-read header; is worker.ts still the entry point?"; exit 1; }
          [ "$rows" -le "$MAX_ROWS_PER_RENDER" ] \
            || { echo "::error::A number page read $rows D1 rows. Some read now scales with the data — see AGENTS.md."; exit 1; }
          # GET twice: the second should come from the colo's edge cache. Warn
          # only — two requests can land on different colos.
          curl -s -o /dev/null "$url"
          edge=$(curl -s -o /dev/null -D - "$url" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-edge-cache"{print $2}')
          echo "x-edge-cache on repeat: $edge"
          [ "$edge" = "HIT" ] || echo "::warning::Repeat request was not an edge-cache HIT ($edge)."

      - name: Crawl surface is bounded
        run: |
          curl -fsS "$SITE/sitemap.xml" -o /tmp/sitemap.xml
          n=$(grep -c '<loc>' /tmp/sitemap.xml)
          echo "sitemap URLs: $n / $MAX_SITEMAP_URLS"
          [ "$n" -lt "$MAX_SITEMAP_URLS" ] \
            || { echo "::error::sitemap.xml lists $n URLs."; exit 1; }
          # A NANP area code never starts with 0 or 1.
          bad=$(grep -oE '/area/[0-9]{3}' /tmp/sitemap.xml | sed 's|/area/||' | grep -cE '^[01]' || true)
          echo "impossible area codes: $bad"
          [ "$bad" -eq 0 ] \
            || { echo "::error::sitemap.xml lists $bad impossible area codes (leading 0 or 1)."; exit 1; }
          # /app is a parallel UI and is noindex; it must never be advertised here.
          grep -q '/app' /tmp/sitemap.xml \
            && { echo "::error::sitemap.xml contains /app URLs."; exit 1; } || true

      - name: Site is serving real data
        run: |
          curl -fsS "$SITE/" -o /tmp/home.html
          grep -q 'Numbers tracked' /tmp/home.html \
            || { echo "::error::Homepage is missing its stats block — the database read is failing."; exit 1; }
          curl -fsS "$SITE/lookup/4164428848" -o /tmp/num.html
          grep -qE 'Likely spam|Verified' /tmp/num.html \
            || { echo "::error::Number page is not rendering lookup results."; exit 1; }
